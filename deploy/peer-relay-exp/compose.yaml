name: craftlink-peer-relay-exp

services:
  relay:
    image: ${EXPERIMENT_RELAY_IMAGE:?Set the experiment relay image}
    restart: unless-stopped
    ports:
      - "${EXPERIMENT_BIND_IPV4:?Set the instance interface IPv4}:${EXPERIMENT_RELAY_PORT:-19100}:19100/tcp"
      - "${EXPERIMENT_BIND_IPV4:?Set the instance interface IPv4}:${EXPERIMENT_RELAY_PORT:-19100}:19100/udp"
      - "${EXPERIMENT_BIND_IPV4:?Set the instance interface IPv4}:3478:3478/udp"
      - "${EXPERIMENT_BIND_IPV4:?Set the instance interface IPv4}:3479:3479/udp"
      - "127.0.0.1:${EXPERIMENT_PANEL_PORT:-19102}:19101/tcp"
    environment:
      MCLINK_DB_ENABLED: "0"
      MCLINK_REQUIRE_ACCOUNT: "1"
      MCLINK_ACCOUNT_FILE: /app/accounts/users.json
      MCLINK_ADMIN_API_ENABLED: "1"
      MCLINK_LITE_PANEL: "1"
      MCLINK_ADMIN_API_TOKEN: ${EXPERIMENT_ADMIN_TOKEN:?Set the experiment API token}
    volumes:
      - accounts:/app/accounts
      - status:/app/status
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  accounts:
  status:
