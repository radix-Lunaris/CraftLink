# =============================================================================
#  CraftLink（方块联机）官网 —— nginx 站点配置
#  用途：把 site/ 这个纯静态目录发布到 80 / 443。
#  放置位置：一般直接贴进 1Panel「网站 → 配置文件」，或放到
#            /etc/nginx/conf.d/craftlink-site.conf 后 `nginx -t && nginx -s reload`。
#
#  ⚠️ 重要：管理面板（后台）运行在【另一个端口 + 一个秘密路径】上，
#     和本站的 80 / 443 完全不冲突。
#     - 本站点的任何页面、任何配置里都【不允许】出现面板入口、面板端口或秘密路径；
#     - 部署本配置时【不需要】删除或修改现有的面板反向代理，两者互不影响；
#     - 面板的访问控制请在面板自己的配置/防火墙里做，不要写进这份文件。
# =============================================================================

# ---------------------------------------------------------------------------
#  纯静态站点，不需要任何 upstream / 反向代理。
#  站点根目录在下面的 server 块里用 root 指定（按你的实际路径改；1Panel 里通常是
#  /opt/1panel/www/sites/<站点名>/index）。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# gzip 压缩（注意：如果 http 段已经 gzip on 过，重复写不算错，但可能出现
# 「duplicate」警告，遇到就把这一整段删掉，只保留 server 块）
# ---------------------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# ---------------------------------------------------------------------------
# HTTP：全部 301 跳到 HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name craftlink.example.com;   # TODO 换成你的域名

    # 证书签发（如 certbot / acme.sh 用 HTTP-01）时，把 webroot 指到这里即可
    location /.well-known/acme-challenge/ {
        root /var/www/craftlink-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：真正的站点
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                      # nginx >= 1.25.1 用 `http2 on;`；老版本改成 listen 443 ssl http2;
    server_name craftlink.example.com;   # TODO 换成你的域名

    # --- 证书 ---------------------------------------------------------------
    # TODO 换成你的证书路径（1Panel 申请的证书一般是下面这种形式）
    ssl_certificate     /etc/nginx/ssl/craftlink.example.com.pem;      # TODO 换成你的证书路径
    ssl_certificate_key /etc/nginx/ssl/craftlink.example.com.key;      # TODO 换成你的证书路径（私钥）
    # 如果证书是 fullchain 形式，请把 ssl_certificate 指向 fullchain.pem，
    # 否则部分浏览器/安卓会报「证书链不完整」。

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:CraftLinkTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- 安全响应头（纯静态站点，不涉及后台，可以放心收紧） -----------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # --- 站点根目录 ---------------------------------------------------------
    # TODO 换成你的实际路径：把 site/ 里 index.html 所在的【文件夹】填在这里，
    #      也就是……/mc-link-v1/site
    root  /opt/1panel/www/sites/craftlink/index;   # TODO 换成你的站点根目录
    index index.html;

    charset utf-8;
    autoindex off;
    server_tokens off;

    # 上传体积（本站是静态站，不需要大文件上传）
    client_max_body_size 4m;

    # --- 路由 ---------------------------------------------------------------
    # 主入口：$uri → $uri/（目录自动找 index.html）→ 404
    location / {
        try_files $uri $uri/ =404;
    }

    # --- ★ 客户端下载：download/CraftLink.exe 必须能正常下载 ------------------
    # 这是本站唯一要对外发布的二进制文件（页面上的「下载 CraftLink.exe」按钮
    # 指向的相对地址就是 download/CraftLink.exe）。
    # 单独写一条 .exe 规则，是为了避免它被下面「禁止访问敏感文件 / 隐藏文件」
    # 那几条正则误伤：nginx 的正则 location 是【按出现顺序第一个匹配的生效】，
    # 所以这条放在最前面，明确放行 .exe。
    location ~* \.exe$ {
        try_files $uri =404;
        default_type application/octet-stream;   # 浏览器/下载器按二进制处理
        # 不强制 Content-Disposition: 直接命中 URL 时正常下载；
        # 以后若想强制另存为，把下面一行取消注释即可
        # add_header Content-Disposition 'attachment; filename="CraftLink.exe"' always;
        expires 1h;                              # 短缓存：发新版本后 1 小时内全部刷新
        add_header Cache-Control "public, max-age=3600";
    }

    # --- 不要把「非网页文件」发出去 -----------------------------------------
    # 这个目录里除了页面、assets/ 和 download/，还放着部署文档（README.md）和这份
    # nginx 配置（deploy/nginx-site.conf）。它们【不是】网站内容：文档写了服务器上的
    # 路径和部署步骤，配置里带证书路径 —— 能被下载就是白白泄露内部信息。
    # 下面三条把它们钉死成 404（注意：nginx 里精确匹配 = 优先级最高，
    # ^~ 前缀匹配优先于正则匹配，所以这几条一定生效）。
    # 它们只针对这几个明确路径，不会影响 download/*.exe —— 上面那条 .exe 规则已经先放行。
    location = /README.md   { return 404; access_log off; }
    location = /readme.md   { return 404; access_log off; }
    location ^~ /deploy/    { return 404; access_log off; }
    location ^~ /scripts/   { return 404; access_log off; }   # 发布前的自检脚本，不对外

    # 隐藏文件（.git / .env / .ht* 等）一律拒绝
    location ~ /\. {
        deny all;
        return 404;
    }

    # robots.txt / favicon.ico：有就发，没有就 404，不写日志
    location = /robots.txt  { try_files $uri =404; access_log off; }
    location = /favicon.ico { try_files $uri =404; access_log off; }

    # 静态资源长缓存：改样式时记得改文件名或加查询串（例如 style.css?v=202609）
    location ~* \.(?:css|js|mjs|svg|ico|woff2?|png|jpe?g|webp|avif)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML 不做长缓存，保证内容更新后访客能立刻看到
    location ~* \.html?$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- 日志 ---------------------------------------------------------------
    access_log /var/log/nginx/craftlink.access.log;
    error_log  /var/log/nginx/craftlink.error.log warn;

    # 自定义错误页（可选）：把 404 指到站点自己的页面
    # error_page 404 /index.html;
}

# =============================================================================
#  再强调一次（部署时最容易误操作的地方）：
#  1. 后台管理面板在【另一个端口 + 秘密路径】，本站不提供也不引用任何入口；
#  2. 部署这份配置【不要】停用或删除面板的反向代理，80/443 与它互不冲突；
#  3. 不要在站点里写服务器 IP、面板端口、密钥或任何内部路径。
# =============================================================================
