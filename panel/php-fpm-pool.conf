; ============================================================
;  CraftLink 面板 -- php-fpm 内存优化池
; ============================================================
;
;  服务器总内存只有 1.58 GB（且没有 swap），所以这里刻意把 php-fpm 的
;  并发压到最小：
;
;    pm = ondemand    没有请求时**一个 worker 都不留**，空闲内存≈0
;    pm.max_children = 3   最多 3 个 worker，上限约 90 MB
;
;  对一个只有你和几个朋友的私人面板来说，3 个并发完全够用。
;
;  改完必须重建容器：
;      docker compose up -d --build
; ============================================================

[global]
; 面板很小，错误日志直接进容器 stdout，交给 docker logs 收集
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = nobody
group = nobody

listen = 127.0.0.1:9000

; ---- 进程管理：按需启动，空闲即回收 ----
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 300

; ---- 请求限制：防止某个请求吃满内存 ----
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M

; ---- session：面板登录态 ----
php_admin_value[session.gc_maxlifetime] = 43200
php_admin_value[session.save_path] = /var/lib/php/sessions

; ---- 关闭不需要的功能，省内存也省排查成本 ----
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; 面板不用上传，关掉文件上传相关的处理
php_admin_value[file_uploads] = 0

; ---- 访问日志 ----
; 关掉：面板流量极小，日志没用，还会占磁盘
access.log = /dev/null
catch_workers_output = yes
