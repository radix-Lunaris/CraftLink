# ============================================================
#  CraftLink 面板容器的主 nginx 配置（/etc/nginx/nginx.conf）
# ============================================================
#
#  这份文件是**静态**的：它只负责 http 层的公共设置，并把「面板设置」渲染
#  出来的 server 块引进来：
#
#      /etc/nginx/mclink-servers/panel-server.conf   ← 由面板设置生成
#      /etc/nginx/mclink-servers/panel-*.inc         ← 同一批渲染出来的片段
#
#  谁来写这些文件、谁来让它们生效：
#      panel/bin/panel-agent.sh（root，supervisord 常驻）
#        ├─ php /var/www/bin/mclink-panel.php render   （渲染）
#        ├─ nginx -t -c /etc/nginx/mclink-nginx-test.conf（候选配置试跑）
#        ├─ 通过 → 原子替换 + nginx -s reload
#        └─ 不通过 → 保留上一份能跑的配置（绝不把面板改成打不开）
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # 面板自己的 server 块（HTTP / HTTPS / 急救入口）。
    include /etc/nginx/mclink-servers/*.conf;
}
