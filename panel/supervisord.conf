; ============================================================
;  CraftLink 面板 -- nginx + php-fpm + 根代理 由 supervisor 同时托管
; ============================================================
;
;  启动顺序（priority，小的先起）：
;     5  mclink-agent-init   一次性：从环境变量播种设置 → 首次渲染配置 → 查证书
;    10  nginx               读 /etc/nginx/mclink-servers/*.conf（init 已渲染好）
;    15  php-fpm
;    20  mclink-agent        常驻循环：处理面板排的请求（渲染 / 装证书 / 续期）
;
;  [!] init 失败（数据库没起来、模板缺失……）**不会**拦住 nginx：镜像里已经
;      有一份构建期渲染好的默认配置，面板照样能打开。真正的守门人是
;      "渲染失败就保留上一份能跑的配置"（见 bin/panel-agent.sh）。
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:mclink-agent-init]
command=/bin/sh /var/www/bin/panel-agent.sh init
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 根代理：面板（php-fpm, nobody）把"渲染 / 装证书 / 续期"写成请求文件，
; 这个进程（root）每 MCLINK_AGENT_INTERVAL 秒（默认 2 秒）取一次并执行。
[program:mclink-agent]
command=/bin/sh /var/www/bin/panel-agent.sh loop
autostart=true
autorestart=true
startsecs=0
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
