# ============================================================
#  CraftLink 面板 -- nginx 站点配置
# ============================================================

server {
    listen 80;
    server_name _;

    root /var/www/panel;
    index index.php;

    charset utf-8;
    client_max_body_size 4m;

    # 面板是内部工具，不要被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- 静态文件 ----
    location /assets/ {
        expires 1h;
        access_log off;
    }

    # ---- /login.php 兼容 ----
    # 很多反向代理（例如 1Panel 自动生成的站点配置）会插入
    #   location ~ \.php$ { fastcgi_pass ...; }
    # 它优先级高于代理用的 `location /`，于是 /login.php 会被劫持到
    # 宿主机的 php-fpm，返回 404。
    #
    # 面板自己的入口始终是 index.php?action=login，所以这里直接把
    # /login.php 内部改写到控制器，不再依赖 nginx 的 PHP 匹配行为。
    location = /login.php {
        return 302 /index.php?action=login;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;

        # ---- 关房间要等，这个超时必须比面板的等待时间长 ----
        #
        # 关房是"通知客户端 → 等它们自己退 → 超时再强断"，正常要十几秒；
        # 中继自己 25 秒放弃，面板等 30 秒，最坏情况还会再花 10 秒清残留行。
        # 30 秒的 fastcgi 超时会先于面板把请求掐掉，管理员看到的是
        # "服务器返回了无法识别的回复"（504）而不是等待页的结果。
        # 60 秒留足余量：面板最坏 40 秒，一定先由面板给出可读的结果。
        fastcgi_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- 禁止访问敏感文件 ----
    # lib/ 位于 web 根目录之外（/var/www/lib），本来就无法通过 HTTP 访问；
    # 这里再加上一层保险，防止以后有人把它挪进根目录。
    location ~ /(config\.php|lib/|\.git) {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # 绝对路径兜底：任何试图用 ../ 跳出根目录的请求都拒绝
    location ~ \.\. {
        deny all;
    }
}
